name: Monitor OLT

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 🔴 ESTE ES EL PASO QUE FALTA O DEBES AGREGAR / ACTUALIZAR:
      - name: Instalar librerías requeridas
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar Monitor OLT
        env:
          ADMINOLT_URL: ${{ secrets.ADMINOLT_URL }}
          ADMINOLT_USER: ${{ secrets.ADMINOLT_USER }}
          ADMINOLT_PASS: ${{ secrets.ADMINOLT_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py
