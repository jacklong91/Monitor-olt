name: Monitor OLT

on:
  schedule:
    # Se ejecuta cada 15 minutos en minutos irregulares para evitar caídas de GitHub
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  escanear:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite al bot guardar el archivo con el estado de las OLTs

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          pip install -r requirements.txt || true
          playwright install chromium --with-deps

      - name: Ejecutar Script de Monitoreo
        env:
          URL_ADMIN: ${{ secrets.URL_ADMIN }}
          USER_ADMIN: ${{ secrets.USER_ADMIN }}
          PASS_ADMIN: ${{ secrets.PASS_ADMIN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Guardar estado en memoria (Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add estado_olts.json || true
          git commit -m "Actualizar estado de OLTs" || true
          git push

      - name: Subir artefactos de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-olt
          path: |
            error_login.png
          if-no-files-found: ignore
